<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台側邊欄</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.sb-wrap { display: flex; min-height: 100vh; }
.sb { position: fixed; inset: 0 auto 0 0; z-index: 40; width: 264px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(-100%); transition: transform .3s var(--ease), width .3s var(--ease); }
.sb.is-open { transform: none; box-shadow: var(--shadow); }
.sb-head { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 700; white-space: nowrap; overflow: hidden; }
.sb-logo { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 13px; }
.sb-body { flex: 1; overflow-y: auto; padding: 12px 10px; }
.sb-group + .sb-group { margin-top: 18px; }
.sb-title { padding: 0 10px 6px; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; white-space: nowrap; }
.sb-item { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: var(--r-sm); color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; position: relative; transition: background .15s, color .15s; }
.sb-item svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sb-item:hover { background: var(--surface-2); color: var(--text); }
.sb-item[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.sb-item[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--sun); }
.sb-count { margin-left: auto; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun); }
.sb-foot { border-top: 1px solid var(--line); padding: 10px; }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; white-space: nowrap; overflow: hidden; }
.sb-avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.sb-scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s; }
.sb.is-open + .sb-scrim { opacity: 1; pointer-events: auto; }
.sb-main { flex: 1; min-width: 0; }
.sb-bar { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.sb-toggle { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2); }
.sb-toggle:hover { background: var(--surface-2); color: var(--text); }
.sb-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.sb-content { padding: 24px 16px; }
.sb-content h1 { font-size: var(--fs-xl); }
.sb-ph { margin-top: 18px; height: 180px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); }
@media (min-width: 900px) {
  .sb { position: sticky; top: 0; height: 100vh; transform: none; box-shadow: none; }
  .sb-scrim { display: none; }
  .sb.is-collapsed { width: 64px; }
  .sb.is-collapsed .sb-title, .sb.is-collapsed .sb-label, .sb.is-collapsed .sb-count, .sb.is-collapsed .sb-name { opacity: 0; pointer-events: none; }
  .sb-content { padding: 32px; }
}
</style>

<div class="sb-wrap">
  <aside class="sb" id="sb" aria-label="側邊選單">
    <div class="sb-head"><span class="sb-logo">太</span><span class="sb-name">太陽電玩後台</span></div>
    <div class="sb-body">
      <div class="sb-group">
        <div class="sb-title">總覽</div>
        <a class="sb-item" href="#" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span class="sb-label">首頁儀表板</span></a>
        <a class="sb-item" href="#"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span class="sb-label">訪客紀錄</span></a>
      </div>
      <div class="sb-group">
        <div class="sb-title">內容管理</div>
        <a class="sb-item" href="#"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16"/></svg><span class="sb-label">遊戲與教學</span></a>
        <a class="sb-item" href="#"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span class="sb-label">密碼序號</span><span class="sb-count num">12</span></a>
        <a class="sb-item" href="#"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="sb-label">遊戲行事曆</span></a>
      </div>
      <div class="sb-group">
        <div class="sb-title">系統</div>
        <a class="sb-item" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span class="sb-label">設定</span></a>
      </div>
    </div>
    <div class="sb-foot"><div class="sb-user"><span class="sb-avatar">C</span><span class="sb-name"><b style="font-size:var(--fs-sm)">Ching</b><br><span class="hint">管理員</span></span></div></div>
  </aside>
  <div class="sb-scrim" id="sb-scrim"></div>
  <div class="sb-main">
    <div class="sb-bar">
      <button class="sb-toggle" id="sb-toggle" aria-label="切換側邊選單"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <span class="muted" style="font-size:var(--fs-sm)">首頁儀表板</span>
    </div>
    <div class="sb-content"><h1>首頁儀表板</h1><p class="muted">這裡放頁面內容。</p><div class="sb-ph"></div></div>
  </div>
</div>

<script>
(() => {
  const sb = document.getElementById('sb'), t = document.getElementById('sb-toggle'), scrim = document.getElementById('sb-scrim');
  const desk = matchMedia('(min-width: 900px)');
  t.addEventListener('click', () => desk.matches ? sb.classList.toggle('is-collapsed') : sb.classList.toggle('is-open'));
  scrim.addEventListener('click', () => sb.classList.remove('is-open'));
  addEventListener('keydown', e => { if (e.key === 'Escape') sb.classList.remove('is-open'); });
})();
</script>
</body>
</html>
