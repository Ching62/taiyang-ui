<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可排序篩選資料表</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.dt-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.dt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dt-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: var(--fs-sm); color: var(--text-2); }
.dt-chip span { font-size: 11px; font-weight: 700; color: var(--muted); }
.dt-chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: transparent; }
.dt-chip[aria-pressed="true"] span { color: var(--bg); opacity: .7; }
.dt-search { width: min(100%, 260px); }
.dt-bulk { display: none; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 10px; border-radius: var(--r-sm); background: var(--sun-soft); font-size: var(--fs-sm); }
.dt-bulk.is-on { display: flex; }
.dt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-sm); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; table-layout: fixed; }
.dt th, .dt td { padding: 12px 14px; text-align: left; border-top: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.dt thead th { border-top: 0; background: var(--surface-2); font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
.dt th button { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: inherit; min-height: 28px; }
.dt th button::after { content: "↕"; opacity: .4; font-size: 11px; }
.dt th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--sun); }
.dt th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--sun); }
.dt tbody tr:hover td { background: var(--surface-2); }
.dt tbody tr.is-sel td { background: var(--sun-soft); }
.dt .r { text-align: right; }
.dt input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--sun); cursor: pointer; }
.dt-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; font-size: var(--fs-sm); color: var(--muted); }
.dt-pages { display: flex; gap: 6px; }
.dt-empty td { text-align: center; padding: 40px 14px; color: var(--muted); }
/* 手機：表格變卡片 */
@media (max-width: 760px) {
  .dt, .dt tbody, .dt tr, .dt td { display: block; width: 100%; }
  .dt { border: 0; background: none; }
  .dt thead { display: none; }
  .dt tbody tr { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); margin-bottom: 10px; padding: 6px 0; position: relative; }
  .dt td { border: 0; padding: 6px 14px; display: grid; grid-template-columns: 7em 1fr; gap: 10px; }
  .dt td > * { justify-self: start; }
  .dt td::before { content: attr(data-label); color: var(--muted); font-size: var(--fs-xs); padding-top: 2px; }
  .dt td.ck { position: absolute; right: 4px; top: 4px; width: auto; display: block; }
  .dt td.ck::before { content: none; }
  .dt .r { text-align: left; }
  .dt tbody tr:hover td { background: none; }
}
</style>

<section class="section">
  <div class="container">
    <div class="dt-bar">
      <div class="dt-chips" id="dt-chips" role="group" aria-label="依狀態篩選"></div>
      <input class="input dt-search" id="dt-q" type="search" placeholder="搜尋序號或遊戲" aria-label="搜尋">
    </div>
    <div class="dt-bulk" id="dt-bulk" role="status"><b id="dt-bulk-n">0</b> 筆已選取<button class="btn btn-sm" style="margin-left:auto">延長 1 天</button><button class="btn btn-sm">停用</button></div>
    <table class="dt">
      <colgroup><col style="width:48px"><col><col><col style="width:16%"><col style="width:14%"><col style="width:16%"></colgroup>
      <thead><tr>
        <th scope="col"><input type="checkbox" id="dt-all" aria-label="全選"></th>
        <th scope="col" data-k="code"><button>密碼序號</button></th>
        <th scope="col" data-k="game"><button>遊戲</button></th>
        <th scope="col" data-k="status"><button>狀態</button></th>
        <th scope="col" data-k="dev" class="r"><button>裝置數</button></th>
        <th scope="col" data-k="left" class="r"><button>剩餘時間</button></th>
      </tr></thead>
      <tbody id="dt-body"></tbody>
    </table>
    <div class="dt-foot"><span id="dt-info"></span><div class="dt-pages"><button class="btn btn-sm" id="dt-prev">上一頁</button><button class="btn btn-sm" id="dt-next">下一頁</button></div></div>
  </div>
</section>

<script>
(() => {
  const GAMES = ['楓之谷經典', '原神', '天堂W', '仙境傳說'], ST = { live: '使用中', idle: '未使用', exp: '已過期' };
  const rows = Array.from({ length: 23 }, (_, i) => { const s = ['live', 'idle', 'exp'][i % 3 === 0 ? 2 : i % 2]; return { id: i, code: String(300000 + ((i * 7919) % 600000)), game: GAMES[i % 4], status: s, dev: 1 + (i % 3), left: s === 'exp' ? 0 : 2 + ((i * 5) % 46) }; });
  let filter = 'all', q = '', sortK = 'left', sortDir = -1, page = 0, sel = new Set();
  const PER = 8, $ = id => document.getElementById(id);
  const badge = s => `<span class="badge ${s === 'live' ? 'badge-up' : s === 'exp' ? 'badge-down' : ''}">${s !== 'idle' ? '<span class="dot"></span>' : ''}${ST[s]}</span>`;
  const view = () => rows.filter(r => (filter === 'all' || r.status === filter) && (!q || r.code.includes(q) || r.game.includes(q)))
    .sort((a, b) => (a[sortK] > b[sortK] ? 1 : a[sortK] < b[sortK] ? -1 : 0) * sortDir);
  function chips() {
    const c = { all: rows.length, live: 0, idle: 0, exp: 0 }; rows.forEach(r => c[r.status]++);
    $('dt-chips').innerHTML = [['all', '全部'], ['live', '使用中'], ['idle', '未使用'], ['exp', '已過期']].map(([k, l]) => `<button class="dt-chip" data-f="${k}" aria-pressed="${filter === k}">${l}<span class="num">${c[k]}</span></button>`).join('');
  }
  function render() {
    const v = view(), pages = Math.max(1, Math.ceil(v.length / PER)); page = Math.min(page, pages - 1);
    const pg = v.slice(page * PER, page * PER + PER);
    $('dt-body').innerHTML = pg.length ? pg.map(r => `<tr class="${sel.has(r.id) ? 'is-sel' : ''}">
      <td class="ck"><input type="checkbox" data-id="${r.id}" ${sel.has(r.id) ? 'checked' : ''} aria-label="選取 ${r.code}"></td>
      <td data-label="密碼序號"><b class="num">${r.code}</b></td><td data-label="遊戲">${r.game}</td><td data-label="狀態">${badge(r.status)}</td>
      <td data-label="裝置數" class="r num">${r.dev} 台</td><td data-label="剩餘時間" class="r num">${r.left ? r.left + ' 小時' : '—'}</td></tr>`).join('')
      : `<tr class="dt-empty"><td colspan="6">沒有符合條件的序號。試試清除搜尋或切換到「全部」。</td></tr>`;
    $('dt-info').textContent = `共 ${v.length} 筆，第 ${page + 1} / ${pages} 頁`;
    $('dt-prev').disabled = page === 0; $('dt-next').disabled = page >= pages - 1;
    $('dt-bulk').classList.toggle('is-on', sel.size > 0); $('dt-bulk-n').textContent = sel.size;
    $('dt-all').checked = pg.length && pg.every(r => sel.has(r.id));
    document.querySelectorAll('.dt th[data-k]').forEach(th => th.setAttribute('aria-sort', th.dataset.k === sortK ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'));
  }
  $('dt-chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; page = 0; chips(); render(); });
  $('dt-q').addEventListener('input', e => { q = e.target.value.trim(); page = 0; render(); });
  document.querySelectorAll('.dt th[data-k] button').forEach(b => b.addEventListener('click', () => { const k = b.parentElement.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; render(); }));
  $('dt-body').addEventListener('change', e => { const id = +e.target.dataset.id; e.target.checked ? sel.add(id) : sel.delete(id); render(); });
  $('dt-all').addEventListener('change', e => { const v = view().slice(page * PER, page * PER + PER); v.forEach(r => e.target.checked ? sel.add(r.id) : sel.delete(r.id)); render(); });
  $('dt-prev').onclick = () => { page--; render(); }; $('dt-next').onclick = () => { page++; render(); };
  chips(); render();
})();
</script>
</body>
</html>
