<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案價格表</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.pr-toggle { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 36px; }
.pr-toggle button { min-height: 38px; padding: 0 18px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); transition: background .2s, color .2s; }
.pr-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.pr-save { margin-left: 6px; color: var(--sun); font-size: var(--fs-xs); }
.pr-grid { display: grid; gap: 16px; }
@media (min-width: 900px) { .pr-grid { grid-template-columns: repeat(3, 1fr); align-items: stretch; } }
.pr-card { position: relative; display: flex; flex-direction: column; padding: 28px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.pr-card.is-pick { border-color: transparent; box-shadow: 0 0 0 1px var(--sun), 0 30px 60px -30px var(--sun-glow); }
.pr-card.is-pick::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: conic-gradient(from var(--a, 0deg), transparent 0 80%, var(--sun) 90%, transparent 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: pr-beam 6s linear infinite; pointer-events: none; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes pr-beam { to { --a: 360deg; } }
.pr-name { display: flex; justify-content: space-between; align-items: center; font-weight: 650; }
.pr-desc { margin-top: 6px; color: var(--muted); font-size: var(--fs-sm); min-height: 3.2em; }
.pr-price { margin-top: 20px; display: flex; align-items: baseline; gap: 6px; }
.pr-price b { font-size: 2.6rem; font-weight: 750; letter-spacing: -0.04em; line-height: 1; transition: opacity .2s, transform .2s; }
.pr-price b.is-swap { opacity: 0; transform: translateY(6px); }
.pr-price span { color: var(--muted); font-size: var(--fs-sm); }
.pr-card .btn { margin-top: 24px; width: 100%; }
.pr-list { margin: 24px 0 0; padding: 20px 0 0; border-top: 1px solid var(--line); list-style: none; display: grid; gap: 12px; font-size: var(--fs-sm); color: var(--text-2); }
.pr-list li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
.pr-list svg { width: 16px; height: 16px; margin-top: 4px; stroke: var(--sun); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pr-list li.off { color: var(--muted); } .pr-list li.off svg { stroke: var(--muted); }
</style>

<section class="section">
  <div class="container">
    <div class="section-head"><h2>選擇適合你的教學方案</h2><p>所有方案都包含真人客服。</p></div>
    <div class="pr-toggle" role="group" aria-label="計價方式">
      <button aria-pressed="true" data-mode="once">單次購買</button>
      <button aria-pressed="false" data-mode="month">包月<span class="pr-save">省 30%</span></button>
    </div>
    <div class="pr-grid">
      <div class="pr-card"><div class="pr-name">單份教學</div><p class="pr-desc">只想學一個主題，例如轉職或打寶路線。</p>
        <div class="pr-price"><b class="num" data-once="150" data-month="105">150</b><span data-unit>元 / 份</span></div>
        <a href="#" class="btn">購買單份</a>
        <ul class="pr-list"><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>一份教學完整內容</li><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>24 小時觀看</li><li class="off"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>不含版本更新</li></ul>
      </div>
      <div class="pr-card is-pick"><div class="pr-name">整款遊戲<span class="badge badge-sun">最多人選</span></div><p class="pr-desc">一款遊戲的全部教學，從新手到進階。</p>
        <div class="pr-price"><b class="num" data-once="490" data-month="343">490</b><span data-unit>元 / 款</span></div>
        <a href="#" class="btn btn-sun">購買整款</a>
        <ul class="pr-list"><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>該遊戲全部教學</li><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>7 天觀看</li><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>改版後免費更新</li></ul>
      </div>
      <div class="pr-card"><div class="pr-name">全站通行</div><p class="pr-desc">所有遊戲、所有教學，適合多開或工作室。</p>
        <div class="pr-price"><b class="num" data-once="1,290" data-month="903">1,290</b><span data-unit>元 / 全站</span></div>
        <a href="#" class="btn">購買全站</a>
        <ul class="pr-list"><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>全部 38 份教學</li><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>30 天觀看</li><li><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>優先客服</li></ul>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  const btns = document.querySelectorAll('.pr-toggle button');
  const units = document.querySelectorAll('[data-unit]');
  units.forEach(u => { u.dataset.base = u.textContent; });
  btns.forEach(b => b.addEventListener('click', () => {
    const mode = b.dataset.mode;
    btns.forEach(x => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('.pr-price b').forEach(el => {
      el.classList.add('is-swap');
      setTimeout(() => { el.textContent = el.dataset[mode]; el.classList.remove('is-swap'); }, 180);
    });
    units.forEach(u => { u.textContent = mode === 'month' ? '元 / 月' : u.dataset.base; });
  }));
})();
</script>
</body>
</html>
