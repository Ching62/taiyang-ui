<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密碼序號解鎖畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.ul-wrap { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; position: relative; overflow: hidden; }
.ul-wrap::before { content: ""; position: absolute; inset: auto 0 -40% 0; height: 70%; background: radial-gradient(50% 50% at 50% 50%, var(--sun-soft), transparent); pointer-events: none; }
.ul-card { position: relative; width: min(100%, 400px); padding: 32px 28px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ul-lock { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 20px; }
.ul-lock svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 1.8; stroke-linecap: round; }
.ul-lock .shackle { transition: transform .45s var(--ease); transform-origin: 16px 11px; }
.ul-card.is-ok .ul-lock { background: var(--sun-soft); border-color: transparent; }
.ul-card.is-ok .ul-lock svg { stroke: var(--sun); }
.ul-card.is-ok .shackle { transform: translateY(-3px) rotate(28deg); }
.ul-card h1 { font-size: var(--fs-xl); }
.ul-card > p { margin-top: 6px; color: var(--text-2); font-size: var(--fs-sm); }
.ul-form { margin-top: 24px; display: grid; gap: 16px; }
.ul-pw { position: relative; }
.ul-pw .input { padding-right: 52px; letter-spacing: .08em; }
.ul-eye { position: absolute; right: 4px; top: 50%; translate: 0 -50%; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.ul-eye:hover { color: var(--text); background: var(--surface-2); }
.ul-eye svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.ul-shake { animation: ul-shake .4s; }
@keyframes ul-shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.ul-form .btn { width: 100%; }
.ul-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: ul-spin .7s linear infinite; display: none; }
.is-loading .ul-spin { display: block; }
@keyframes ul-spin { to { transform: rotate(360deg); } }
.ul-note { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); }
.ul-note a { color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; }
</style>

<div class="ul-wrap">
  <div class="ul-card" id="ul-card">
    <div class="ul-lock" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="7" y="14" width="18" height="13" rx="3"/><path class="shackle" d="M11 14v-3a5 5 0 0110 0v3"/></svg></div>
    <h1 id="ul-title">輸入密碼序號</h1>
    <p id="ul-desc">楓之谷經典 · 弓箭手二轉完整流程</p>
    <form class="ul-form" id="ul-form" novalidate>
      <div class="field" id="ul-field">
        <label class="label" for="ul-code">密碼序號</label>
        <div class="ul-pw">
          <input class="input num" id="ul-code" type="password" inputmode="numeric" autocomplete="off" placeholder="你的 8591 會員編號" aria-describedby="ul-hint">
          <button type="button" class="ul-eye" id="ul-eye" aria-label="顯示序號"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <span class="hint" id="ul-hint">購買後我們會在 8591 訂單留言提供。</span>
      </div>
      <button class="btn btn-primary" id="ul-btn" type="submit"><span class="ul-spin" aria-hidden="true"></span><span id="ul-btn-text">解鎖教學</span></button>
    </form>
    <p class="ul-note">序號開通後 24 小時內有效。過期或無法登入，請<a href="#">私訊客服</a>重新開通。</p>
  </div>
</div>

<script>
(() => {
  const DEMO = '453058'; // 示範用；正式版要改成伺服器端驗證
  const card = document.getElementById('ul-card'), form = document.getElementById('ul-form'), field = document.getElementById('ul-field');
  const code = document.getElementById('ul-code'), hint = document.getElementById('ul-hint'), btn = document.getElementById('ul-btn'), btnText = document.getElementById('ul-btn-text');
  const eye = document.getElementById('ul-eye');
  const baseHint = hint.textContent;
  eye.addEventListener('click', () => { const show = code.type === 'password'; code.type = show ? 'text' : 'password'; eye.setAttribute('aria-label', show ? '隱藏序號' : '顯示序號'); });
  code.addEventListener('input', () => { field.classList.remove('is-error'); hint.textContent = baseHint; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = code.value.trim();
    if (!v) return fail('請輸入密碼序號。');
    if (!/^\d+$/.test(v)) return fail('序號只包含數字，請再確認一次。');
    btn.classList.add('is-loading'); btn.disabled = true; btnText.textContent = '驗證中';
    setTimeout(() => {
      btn.classList.remove('is-loading'); btn.disabled = false;
      if (v === DEMO) { card.classList.add('is-ok'); btnText.textContent = '已解鎖，前往教學'; document.getElementById('ul-title').textContent = '解鎖成功'; }
      else { btnText.textContent = '解鎖教學'; fail('序號不正確或已過期。請核對 8591 訂單留言，或私訊客服重新開通。'); }
    }, 900);
  });
  function fail(msg) { field.classList.add('is-error'); hint.textContent = msg; code.classList.remove('ul-shake'); void code.offsetWidth; code.classList.add('ul-shake'); code.focus(); }
})();
</script>
</body>
</html>
