<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快速搜尋面板（Ctrl＋K）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.cp-trigger { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; width: min(100%, 360px); padding: 0 10px 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); font-size: var(--fs-sm); }
.cp-trigger svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.cp-trigger .kbds { margin-left: auto; display: flex; gap: 4px; }
.cp-back { position: fixed; inset: 0; z-index: 100; background: rgba(5, 6, 9, .45); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.cp-back.is-open { display: flex; animation: cp-fade .18s var(--ease); }
@keyframes cp-fade { from { opacity: 0; } }
.cp { width: min(100%, 560px); border-radius: var(--r-lg); background: var(--raised); border: 1px solid var(--line-strong); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); overflow: hidden; animation: cp-pop .22s var(--ease); }
@keyframes cp-pop { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
.cp-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.cp-in svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.cp-in input { flex: 1; min-width: 0; height: 56px; border: 0; background: transparent; font-size: var(--fs-md); outline: none; }
.cp-list { max-height: min(56vh, 380px); overflow-y: auto; padding: 8px; }
.cp-group { padding: 8px 10px 4px; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.cp-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); }
.cp-item[aria-selected="true"] { background: var(--surface-2); }
.cp-item[aria-selected="true"] .cp-ic { color: var(--sun); }
.cp-ic { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line); color: var(--text-2); }
.cp-ic svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.cp-item small { margin-left: auto; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
.cp-item mark { background: none; color: var(--sun); font-weight: 700; }
.cp-empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: var(--fs-sm); display: none; }
.cp-foot { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); }
.cp-foot span { display: inline-flex; align-items: center; gap: 6px; }
.cp-out { margin-top: 16px; font-size: var(--fs-sm); color: var(--muted); }
</style>

<section class="section">
  <div class="container">
    <button class="cp-trigger" id="cp-open" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>搜尋遊戲、教學、功能<span class="kbds"><span class="kbd" id="cp-mod">Ctrl</span><span class="kbd">K</span></span></button>
    <p class="cp-out" id="cp-out">試著按下 Ctrl＋K。</p>
  </div>
</section>

<div class="cp-back" id="cp-back" role="dialog" aria-modal="true" aria-label="快速搜尋">
  <div class="cp">
    <div class="cp-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cp-q" placeholder="輸入關鍵字…" autocomplete="off" role="combobox" aria-controls="cp-list" aria-expanded="true"></div>
    <div class="cp-list" id="cp-list" role="listbox"></div>
    <div class="cp-empty" id="cp-empty">找不到符合的結果，換個關鍵字試試。</div>
    <div class="cp-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>選擇</span><span><span class="kbd">Enter</span>開啟</span><span><span class="kbd">Esc</span>關閉</span></div>
  </div>
</div>

<script>
(() => {
  const ICON = { game: '<path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/>', doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>', act: '<path d="M12 5v14M5 12h14"/>' };
  const DATA = [
    { g: '遊戲', i: 'game', t: '楓之谷經典', s: '12 份教學' }, { g: '遊戲', i: 'game', t: '原神', s: '9 份教學' }, { g: '遊戲', i: 'game', t: '天堂W', s: '7 份教學' },
    { g: '教學', i: 'doc', t: '弓箭手二轉完整流程', s: '楓之谷經典' }, { g: '教學', i: 'doc', t: '深淵十二層配隊', s: '原神' }, { g: '教學', i: 'doc', t: '新手到 30 等最快路線', s: '楓之谷經典' },
    { g: '功能', i: 'act', t: '輸入密碼序號', s: '' }, { g: '功能', i: 'act', t: '聯絡客服', s: '' }
  ];
  const back = document.getElementById('cp-back'), q = document.getElementById('cp-q'), list = document.getElementById('cp-list'), empty = document.getElementById('cp-empty'), out = document.getElementById('cp-out');
  if (/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('cp-mod').textContent = '⌘';
  let items = [], sel = 0, lastFocus;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function render() {
    const k = q.value.trim().toLowerCase();
    items = DATA.filter(d => !k || d.t.toLowerCase().includes(k) || d.s.toLowerCase().includes(k));
    let html = '', last = '';
    items.forEach((d, n) => {
      if (d.g !== last) { html += `<div class="cp-group">${d.g}</div>`; last = d.g; }
      let t = esc(d.t); if (k) { const at = d.t.toLowerCase().indexOf(k); if (at > -1) t = esc(d.t.slice(0, at)) + '<mark>' + esc(d.t.slice(at, at + k.length)) + '</mark>' + esc(d.t.slice(at + k.length)); }
      html += `<div class="cp-item" role="option" id="cp-o${n}" data-n="${n}" aria-selected="${n === sel}"><span class="cp-ic"><svg viewBox="0 0 24 24">${ICON[d.i]}</svg></span>${t}${d.s ? `<small>${esc(d.s)}</small>` : ''}</div>`;
    });
    list.innerHTML = html; empty.style.display = items.length ? 'none' : 'block';
    q.setAttribute('aria-activedescendant', items.length ? 'cp-o' + sel : '');
  }
  const move = d => { if (!items.length) return; sel = (sel + d + items.length) % items.length; render(); document.getElementById('cp-o' + sel)?.scrollIntoView({ block: 'nearest' }); };
  const choose = () => { const d = items[sel]; if (!d) return; out.textContent = '你選擇了：' + d.t; close(); };
  function open() { lastFocus = document.activeElement; back.classList.add('is-open'); q.value = ''; sel = 0; render(); q.focus(); }
  function close() { back.classList.remove('is-open'); lastFocus?.focus(); }
  document.getElementById('cp-open').addEventListener('click', open);
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); back.classList.contains('is-open') ? close() : open(); }
    if (!back.classList.contains('is-open')) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); } else if (e.key === 'Enter') { e.preventDefault(); choose(); }
  });
  q.addEventListener('input', () => { sel = 0; render(); });
  list.addEventListener('click', e => { const it = e.target.closest('.cp-item'); if (it) { sel = +it.dataset.n; choose(); } });
  list.addEventListener('pointermove', e => { const it = e.target.closest('.cp-item'); if (it && +it.dataset.n !== sel) { sel = +it.dataset.n; list.querySelectorAll('.cp-item').forEach(x => x.setAttribute('aria-selected', +x.dataset.n === sel)); } });
  back.addEventListener('click', e => { if (e.target === back) close(); });
})();
</script>
</body>
</html>
