<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滑動指示頁籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ==========================================================
   太陽電玩組件庫 — 設計變數
   原則：一道光源（晨曦金），其餘全是石墨灰與細線。
   淺色為預設；系統深色模式或 data-theme="dark" 時切換深色。
   ========================================================== */
:root {
  /* 底色層級：背景 → 面板 → 浮起 */
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --raised: #ffffff;

  /* 文字 */
  --text: #14161b;
  --text-2: #4a4f5a;
  --muted: #7a808c;

  /* 線條 */
  --line: rgba(20, 22, 27, 0.09);
  --line-strong: rgba(20, 22, 27, 0.16);

  /* 唯一重點色：晨曦金 */
  --sun: #c7811a;
  --sun-soft: rgba(199, 129, 26, 0.12);
  --sun-glow: rgba(233, 162, 59, 0.28);
  --on-sun: #ffffff;

  /* 狀態色（只用在狀態，不當裝飾） */
  --up: #1f8a5b;
  --down: #c8433a;
  --warn: #b7791f;
  --info: #2f6fbd;

  /* 字體 */
  --font: "Manrope", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;

  /* 字級（1.25 比例） */
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.25rem;
  --fs-xl: 1.5625rem;
  --fs-2xl: 1.953rem;
  --fs-3xl: clamp(2rem, 4.2vw, 3.05rem);
  --fs-4xl: clamp(2.4rem, 6vw, 4.2rem);

  /* 間距 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px;

  /* 圓角三級：控制項 / 面板 / 大區塊 */
  --r-sm: 7px;
  --r-md: 12px;
  --r-lg: 20px;

  --shadow: 0 1px 2px rgba(20, 22, 27, 0.05), 0 8px 24px -12px rgba(20, 22, 27, 0.12);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --container: 1120px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11;
    --surface: #111419;
    --surface-2: #171a21;
    --raised: #1b1f27;
    --text: #eceef2;
    --text-2: #b4b9c3;
    --muted: #7d8390;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(255, 255, 255, 0.14);
    --sun: #eaa543;
    --sun-soft: rgba(234, 165, 67, 0.12);
    --sun-glow: rgba(234, 165, 67, 0.22);
    --on-sun: #1a1206;
    --up: #3fbf86;
    --down: #ef6a5f;
    --warn: #e2b04a;
    --info: #6ea8ef;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11;
  --surface: #111419;
  --surface-2: #171a21;
  --raised: #1b1f27;
  --text: #eceef2;
  --text-2: #b4b9c3;
  --muted: #7d8390;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --sun: #eaa543;
  --sun-soft: rgba(234, 165, 67, 0.12);
  --sun-glow: rgba(234, 165, 67, 0.22);
  --on-sun: #1a1206;
  --up: #3fbf86;
  --down: #ef6a5f;
  --warn: #e2b04a;
  --info: #6ea8ef;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -16px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ==========================================================
   太陽電玩組件庫 — 基礎樣式（重設、文字、按鈕、表單、工具類）
   每個組件都建立在這份之上。
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.7;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;            /* 保險：永遠不出現橫向捲動 */
  overflow-wrap: anywhere;     /* 長字自動換行 */
  word-break: normal;
}
img, svg, video, canvas { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--sun-soft); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.container { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 20px; }
@media (min-width: 768px) { .container { padding-inline: 32px; } }
.stack > * + * { margin-top: var(--s-4); }
.muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
  border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--text);
  transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
.btn-primary:hover { background: var(--text); box-shadow: 0 0 0 4px var(--line); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: transparent; }
.btn-sun:hover { background: var(--sun); box-shadow: 0 6px 24px -6px var(--sun-glow); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- 標籤 / 按鍵 ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge-sun { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.badge-up { color: var(--up); }
.badge-down { color: var(--down); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-size: 11px; font-weight: 600; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
}

/* ---------- 表單 ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border-radius: var(--r-sm);
  background: var(--surface); border: 1px solid var(--line-strong);
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.field.is-error .input { border-color: var(--down); }
.field.is-error .hint { color: var(--down); }

/* ---------- 面板 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- 區塊標題 ---------- */
.section { padding-block: clamp(56px, 9vw, 112px); }
.section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 56px); }
.section-head h2 { font-size: var(--fs-3xl); }
.section-head p { margin-top: 14px; color: var(--text-2); font-size: var(--fs-lg); line-height: 1.6; }

/* ---------- 動畫偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<style>
.tb-list { position: relative; display: flex; flex-wrap: wrap; gap: 4px 24px; border-bottom: 1px solid var(--line); }
.tb-list button { position: relative; min-height: 44px; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); transition: color .2s; }
.tb-list button:hover, .tb-list button[aria-selected="true"] { color: var(--text); }
.tb-ind { position: absolute; bottom: -1px; height: 2px; background: var(--sun); border-radius: 2px; transition: left .3s var(--ease), width .3s var(--ease), top .3s var(--ease); }
.tb-panel { padding-top: 24px; animation: tb-in .3s var(--ease); }
.tb-panel[hidden] { display: none; }
@keyframes tb-in { from { opacity: 0; transform: translateY(4px); } }
.tb-panel p { color: var(--text-2); max-width: 40em; }
</style>

<section class="section">
  <div class="container">
    <div class="tb" id="tb">
      <div class="tb-list" role="tablist" aria-label="教學內容">
        <button role="tab" aria-selected="true" aria-controls="tb-1" id="tb-t1">教學內容</button>
        <button role="tab" aria-selected="false" aria-controls="tb-2" id="tb-t2" tabindex="-1">準備事項</button>
        <button role="tab" aria-selected="false" aria-controls="tb-3" id="tb-t3" tabindex="-1">常見錯誤</button>
        <button role="tab" aria-selected="false" aria-controls="tb-4" id="tb-t4" tabindex="-1">更新紀錄</button>
        <span class="tb-ind" aria-hidden="true"></span>
      </div>
      <div class="tb-panel" role="tabpanel" id="tb-1" aria-labelledby="tb-t1"><p>這份教學帶你從 30 等走到二轉，共 8 個步驟，每步都附截圖與注意事項。</p></div>
      <div class="tb-panel" role="tabpanel" id="tb-2" aria-labelledby="tb-t2" hidden><p>開始前請準備：紅藥水 200 瓶、藍藥水 100 瓶，以及至少 5 萬楓幣。</p></div>
      <div class="tb-panel" role="tabpanel" id="tb-3" aria-labelledby="tb-t3" hidden><p>最常見的錯誤是沒先接轉職任務就去打怪，記得先到弓箭手村找赫麗娜。</p></div>
      <div class="tb-panel" role="tabpanel" id="tb-4" aria-labelledby="tb-t4" hidden><p>11 月 14 日：配合新版本更新第 5 步的地圖位置。</p></div>
    </div>
  </div>
</section>

<script>
(() => {
  const root = document.getElementById('tb'), tabs = [...root.querySelectorAll('[role=tab]')], ind = root.querySelector('.tb-ind');
  const place = t => { ind.style.left = t.offsetLeft + 'px'; ind.style.width = t.offsetWidth + 'px'; ind.style.top = (t.offsetTop + t.offsetHeight - 1) + 'px'; };
  const pick = t => {
    tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
    place(t);
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => pick(t));
    t.addEventListener('keydown', e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d) { const n = tabs[(i + d + tabs.length) % tabs.length]; n.focus(); pick(n); } });
  });
  addEventListener('resize', () => place(tabs.find(t => t.getAttribute('aria-selected') === 'true')));
  document.fonts?.ready.then(() => place(tabs[0])); place(tabs[0]);
})();
</script>
</body>
</html>
