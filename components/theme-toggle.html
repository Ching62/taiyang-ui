<!--
名稱: 深淺色切換
分類: 小工具
說明: 三段切換（跟隨系統／淺色／深色），選擇會記住（瀏覽器無法儲存時也不會出錯），切換時整頁顏色平滑過渡。
來源: Magic UI animated-theme-toggler（MIT）改寫為原生 HTML
適用: 通用
高度: 360
-->
<style>
.tt { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tt button { width: 40px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); transition: background .2s, color .2s; }
.tt button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tt button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
html.is-theming, html.is-theming * { transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease) !important; }
.tt-demo { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
</style>

<section class="section">
  <div class="container tt-demo">
    <div class="tt" role="group" aria-label="配色模式">
      <button data-mode="system" aria-label="跟隨系統"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button data-mode="light" aria-label="淺色"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-mode="dark" aria-label="深色"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
    </div>
    <span class="muted" style="font-size:var(--fs-sm)" id="tt-say"></span>
  </div>
</section>

<script>
(() => {
  const KEY = 'sungame-theme', root = document.documentElement, btns = document.querySelectorAll('.tt button'), say = document.getElementById('tt-say');
  const NAME = { system: '跟隨系統', light: '淺色', dark: '深色' };
  const get = () => { try { return localStorage.getItem(KEY) || 'system'; } catch { return 'system'; } };
  const apply = (m, animate) => {
    if (animate) { root.classList.add('is-theming'); setTimeout(() => root.classList.remove('is-theming'), 400); }
    m === 'system' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', m);
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); say.textContent = '目前：' + NAME[m];
    try { localStorage.setItem(KEY, m); } catch {}
  };
  btns.forEach(b => b.addEventListener('click', () => apply(b.dataset.mode, true)));
  apply(root.getAttribute('data-theme') || get(), false);
})();
</script>
