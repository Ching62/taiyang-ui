<!--
名稱: 快速搜尋面板（Ctrl＋K）
分類: 表單
說明: 按 Ctrl＋K（Mac 為 ⌘＋K）或點搜尋鈕，跳出置中搜尋面板：分組結果、方向鍵上下選、Enter 開啟、Esc 關閉、關鍵字標示、找不到時提示。
來源: shadcn/ui command（MIT，原為 cmdk）改寫為原生 HTML
適用: 通用
高度: 620
-->
<style>
.cp-trigger { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; width: min(100%, 360px); padding: 0 10px 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); font-size: var(--fs-sm); }
.cp-trigger svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.cp-trigger .kbds { margin-left: auto; display: flex; gap: 4px; }
.cp-back { position: fixed; inset: 0; z-index: 100; background: rgba(5, 6, 9, .45); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.cp-back.is-open { display: flex; animation: cp-fade .18s var(--ease); }
@keyframes cp-fade { from { opacity: 0; } }
.cp { width: min(100%, 560px); border-radius: var(--r-lg); background: var(--raised); border: 1px solid var(--line-strong); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); overflow: hidden; animation: cp-pop .22s var(--ease); }
@keyframes cp-pop { from { transform: translateY(-8px) scale(.98); opacity: 0; } }
.cp-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.cp-in svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
.cp-in input { flex: 1; min-width: 0; height: 56px; border: 0; background: transparent; font-size: var(--fs-md); outline: none; }
.cp-list { max-height: min(56vh, 380px); overflow-y: auto; padding: 8px; }
.cp-group { padding: 8px 10px 4px; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.cp-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); }
.cp-item[aria-selected="true"] { background: var(--surface-2); }
.cp-item[aria-selected="true"] .cp-ic { color: var(--sun); }
.cp-ic { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--line); color: var(--text-2); }
.cp-ic svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.cp-item small { margin-left: auto; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
.cp-item mark { background: none; color: var(--sun); font-weight: 700; }
.cp-empty { padding: 36px 16px; text-align: center; color: var(--muted); font-size: var(--fs-sm); display: none; }
.cp-foot { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); }
.cp-foot span { display: inline-flex; align-items: center; gap: 6px; }
.cp-out { margin-top: 16px; font-size: var(--fs-sm); color: var(--muted); }
</style>

<section class="section">
  <div class="container">
    <button class="cp-trigger" id="cp-open" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>搜尋遊戲、教學、功能<span class="kbds"><span class="kbd" id="cp-mod">Ctrl</span><span class="kbd">K</span></span></button>
    <p class="cp-out" id="cp-out">試著按下 Ctrl＋K。</p>
  </div>
</section>

<div class="cp-back" id="cp-back" role="dialog" aria-modal="true" aria-label="快速搜尋">
  <div class="cp">
    <div class="cp-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cp-q" placeholder="輸入關鍵字…" autocomplete="off" role="combobox" aria-controls="cp-list" aria-expanded="true"></div>
    <div class="cp-list" id="cp-list" role="listbox"></div>
    <div class="cp-empty" id="cp-empty">找不到符合的結果，換個關鍵字試試。</div>
    <div class="cp-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>選擇</span><span><span class="kbd">Enter</span>開啟</span><span><span class="kbd">Esc</span>關閉</span></div>
  </div>
</div>

<script>
(() => {
  const ICON = { game: '<path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/>', doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>', act: '<path d="M12 5v14M5 12h14"/>' };
  const DATA = [
    { g: '遊戲', i: 'game', t: '楓之谷經典', s: '12 份教學' }, { g: '遊戲', i: 'game', t: '原神', s: '9 份教學' }, { g: '遊戲', i: 'game', t: '天堂W', s: '7 份教學' },
    { g: '教學', i: 'doc', t: '弓箭手二轉完整流程', s: '楓之谷經典' }, { g: '教學', i: 'doc', t: '深淵十二層配隊', s: '原神' }, { g: '教學', i: 'doc', t: '新手到 30 等最快路線', s: '楓之谷經典' },
    { g: '功能', i: 'act', t: '輸入密碼序號', s: '' }, { g: '功能', i: 'act', t: '聯絡客服', s: '' }
  ];
  const back = document.getElementById('cp-back'), q = document.getElementById('cp-q'), list = document.getElementById('cp-list'), empty = document.getElementById('cp-empty'), out = document.getElementById('cp-out');
  if (/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('cp-mod').textContent = '⌘';
  let items = [], sel = 0, lastFocus;
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function render() {
    const k = q.value.trim().toLowerCase();
    items = DATA.filter(d => !k || d.t.toLowerCase().includes(k) || d.s.toLowerCase().includes(k));
    let html = '', last = '';
    items.forEach((d, n) => {
      if (d.g !== last) { html += `<div class="cp-group">${d.g}</div>`; last = d.g; }
      let t = esc(d.t); if (k) { const at = d.t.toLowerCase().indexOf(k); if (at > -1) t = esc(d.t.slice(0, at)) + '<mark>' + esc(d.t.slice(at, at + k.length)) + '</mark>' + esc(d.t.slice(at + k.length)); }
      html += `<div class="cp-item" role="option" id="cp-o${n}" data-n="${n}" aria-selected="${n === sel}"><span class="cp-ic"><svg viewBox="0 0 24 24">${ICON[d.i]}</svg></span>${t}${d.s ? `<small>${esc(d.s)}</small>` : ''}</div>`;
    });
    list.innerHTML = html; empty.style.display = items.length ? 'none' : 'block';
    q.setAttribute('aria-activedescendant', items.length ? 'cp-o' + sel : '');
  }
  const move = d => { if (!items.length) return; sel = (sel + d + items.length) % items.length; render(); document.getElementById('cp-o' + sel)?.scrollIntoView({ block: 'nearest' }); };
  const choose = () => { const d = items[sel]; if (!d) return; out.textContent = '你選擇了：' + d.t; close(); };
  function open() { lastFocus = document.activeElement; back.classList.add('is-open'); q.value = ''; sel = 0; render(); q.focus(); }
  function close() { back.classList.remove('is-open'); lastFocus?.focus(); }
  document.getElementById('cp-open').addEventListener('click', open);
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); back.classList.contains('is-open') ? close() : open(); }
    if (!back.classList.contains('is-open')) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); } else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); } else if (e.key === 'Enter') { e.preventDefault(); choose(); }
  });
  q.addEventListener('input', () => { sel = 0; render(); });
  list.addEventListener('click', e => { const it = e.target.closest('.cp-item'); if (it) { sel = +it.dataset.n; choose(); } });
  list.addEventListener('pointermove', e => { const it = e.target.closest('.cp-item'); if (it && +it.dataset.n !== sel) { sel = +it.dataset.n; list.querySelectorAll('.cp-item').forEach(x => x.setAttribute('aria-selected', +x.dataset.n === sel)); } });
  back.addEventListener('click', e => { if (e.target === back) close(); });
})();
</script>
